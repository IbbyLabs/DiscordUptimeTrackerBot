name: Docker Release

# Each architecture builds on its own native runner rather than emulating arm64
# through QEMU. The per-arch jobs push by digest only; the merge job stitches
# the digests into one tagged multi-arch manifest, so :latest exists only once
# both architectures are present.
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: The tag or ref to build
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge the manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # A dispatch run has no release payload, so the version comes from the ref
      # it was given. :latest is applied only for a published release.
      - name: Resolve the version
        id: version
        run: |
          version="${{ github.event.release.tag_name }}"
          if [ -z "$version" ]; then
            version="${{ github.event.inputs.ref }}"
          fi
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME}"
          fi
          echo "tag=${version}" >> "$GITHUB_OUTPUT"

      - name: Create the manifest
        working-directory: /tmp/digests
        run: |
          image="${{ steps.image.outputs.name }}"
          tags="-t ${image}:${{ steps.version.outputs.tag }}"
          if [ "${{ github.event_name }}" = "release" ]; then
            tags="${tags} -t ${image}:latest"
          fi
          # shellcheck disable=SC2086
          docker buildx imagetools create ${tags} \
            $(printf "${image}@sha256:%s " *)

      - name: Show what was pushed
        run: |
          docker buildx imagetools inspect \
            "${{ steps.image.outputs.name }}:${{ steps.version.outputs.tag }}"
